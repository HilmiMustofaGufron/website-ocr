{% set ep = request.endpoint or '' %}
<aside class="sidebar" id="sidebar" aria-label="Menu utama">
    <a class="sidebar-brand" href="{{ url_for('dashboard.index') }}">
        <span class="dot"></span>PT Akebono Brake Astra Indonesia
    </a>

    <nav class="sidebar-nav">
        <a class="sidebar-link {{ 'active' if ep.startswith('dashboard.') else '' }}"
            href="{{ url_for('dashboard.dashboard') }}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1.5" />
                <rect x="14" y="3" width="7" height="7" rx="1.5" />
                <rect x="3" y="14" width="7" height="7" rx="1.5" />
                <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
            <span>Dashboard</span>
        </a>
        <a class="sidebar-link {{ 'active' if ep.startswith('monitoring.') else '' }}"
            href="{{ url_for('monitoring.monitoring_page') }}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="2" y="6" width="13" height="12" rx="2" />
                <path d="M15 10.5l6-3.5v10l-6-3.5z" />
            </svg>
            <span>Monitoring</span>
        </a>
        <a class="sidebar-link {{ 'active' if ep.startswith('history.') else '' }}"
            href="{{ url_for('history.history_page') }}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
            </svg>
            <span>History</span>
        </a>
        <a class="sidebar-link {{ 'active' if ep.startswith('master_kode.') else '' }}"
            href="{{ url_for('master_kode.master_kode_page') }}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h10" />
            </svg>
            <span>Master Kode</span>
        </a>
        <a class="sidebar-link {{ 'active' if ep.startswith('settings.') else '' }}"
            href="{{ url_for('settings.settings_page') }}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h10M18 6h2M4 12h3M11 12h9M4 18h11M19 18h1" />
                <circle cx="16" cy="6" r="2" />
                <circle cx="9" cy="12" r="2" />
                <circle cx="17" cy="18" r="2" />
            </svg>
            <span>Settings</span>
        </a>
    </nav>

    <div class="sidebar-user">
        <div class="avatar" aria-hidden="true">{{ (pengguna_nama or '?')[:1]|upper }}</div>
        <div class="nama" title="{{ pengguna_nama }}">{{ pengguna_nama }}</div>
        <form method="post" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn-keluar">Keluar</button>
        </form>
    </div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
